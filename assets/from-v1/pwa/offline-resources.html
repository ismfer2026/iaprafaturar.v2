<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iaprafaturar — Sem conexão</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0D6E6E 0%, #065f5f 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff; padding: 24px; text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 20px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    h1 { font-size: 26px; font-weight: 900; margin-bottom: 10px; }
    .sub { font-size: 15px; opacity: 0.8; max-width: 320px; line-height: 1.5; margin-bottom: 28px; }
    .card {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px; padding: 20px 24px; max-width: 340px; width: 100%; margin-bottom: 20px;
    }
    .card-title { font-size: 12px; font-weight: 700; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 14px; }
    .feature { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.08); text-align: left; }
    .feature:last-child { border-bottom: none; }
    .feature-icon { font-size: 18px; flex-shrink: 0; }
    .feature-text { font-size: 13px; opacity: 0.9; flex: 1; }
    .feature-badge { font-size: 10px; background: rgba(255,255,255,0.15); padding: 2px 8px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
    .pending-card {
      background: rgba(249,115,22,0.2); border: 1px solid rgba(249,115,22,0.4);
      border-radius: 16px; padding: 14px 20px; max-width: 340px; width: 100%;
      margin-bottom: 20px; display: none;
    }
    .pending-card.visible { display: block; }
    .pending-text { font-size: 13px; opacity: 0.9; }
    .btn {
      background: #fff; color: #0D6E6E; border: none; border-radius: 14px;
      padding: 14px 32px; font-size: 15px; font-weight: 900; cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15); width: 100%; max-width: 340px;
      transition: transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .sync-info { font-size: 11px; opacity: 0.5; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="icon">📴</div>
  <h1>Sem conexão</h1>
  <p class="sub">Seus dados recentes estão salvos localmente e disponíveis para consulta.</p>

  <div class="pending-card" id="pendingCard">
    <p class="pending-text">
      ⏳ <strong id="pendingCount">0</strong> alteração(ões) pendente(s) — serão sincronizadas automaticamente quando a conexão voltar.
    </p>
  </div>

  <div class="card">
    <div class="card-title">Disponível agora</div>
    <div class="feature">
      <span class="feature-icon">📅</span>
      <span class="feature-text">Agenda dos próximos 7 dias</span>
      <span class="feature-badge" id="apptCount">—</span>
    </div>
    <div class="feature">
      <span class="feature-icon">👥</span>
      <span class="feature-text">Lista de clientes</span>
      <span class="feature-badge" id="clientCount">—</span>
    </div>
    <div class="feature">
      <span class="feature-icon">🔄</span>
      <span class="feature-text">Sincronização automática ao reconectar</span>
    </div>
  </div>

  <button class="btn" id="reconnectBtn" onclick="tryReconnect()">
    Tentar reconectar
  </button>
  <p class="sync-info" id="lastSync"></p>

  <script>
    // Lê dados reais do IndexedDB
    function openDB() {
      return new Promise((res, rej) => {
        const req = indexedDB.open('iaprafaturar-offline', 2)
        req.onsuccess = () => res(req.result)
        req.onerror = () => rej(req.error)
        req.onupgradeneeded = () => {}
      })
    }

    async function loadStats() {
      try {
        const db = await openDB()
        const stores = db.objectStoreNames

        if (stores.contains('appointments')) {
          const req = db.transaction('appointments', 'readonly').objectStore('appointments').count()
          req.onsuccess = () => {
            document.getElementById('apptCount').textContent = req.result + ' itens'
          }
        }

        if (stores.contains('clients')) {
          const req = db.transaction('clients', 'readonly').objectStore('clients').count()
          req.onsuccess = () => {
            document.getElementById('clientCount').textContent = req.result + ' clientes'
          }
        }

        if (stores.contains('pending_sync')) {
          const req = db.transaction('pending_sync', 'readonly').objectStore('pending_sync').count()
          req.onsuccess = () => {
            if (req.result > 0) {
              document.getElementById('pendingCount').textContent = req.result
              document.getElementById('pendingCard').classList.add('visible')
            }
          }
        }

        if (stores.contains('meta')) {
          const req = db.transaction('meta', 'readonly').objectStore('meta').get('last_sync')
          req.onsuccess = () => {
            if (req.result?.value) {
              const d = new Date(req.result.value)
              document.getElementById('lastSync').textContent =
                'Última sincronização: ' + d.toLocaleString('pt-BR')
            }
          }
        }
      } catch (e) {
        console.log('[offline] IDB não disponível')
      }
    }

    // Botão de reconectar — testa a conexão de verdade
    async function tryReconnect() {
      const btn = document.getElementById('reconnectBtn')
      btn.textContent = 'Verificando conexão...'
      btn.disabled = true
      try {
        // Tenta buscar um asset pequeno com cache busting
        const res = await fetch('/icon-192x192.png?t=' + Date.now(), {
          cache: 'no-store',
          signal: AbortSignal.timeout(5000)
        })
        if (res.ok) {
          btn.textContent = 'Conectado! Redirecionando...'
          window.location.href = '/'
        } else {
          throw new Error('Status ' + res.status)
        }
      } catch {
        btn.textContent = 'Ainda sem conexão'
        setTimeout(() => {
          btn.textContent = 'Tentar reconectar'
          btn.disabled = false
        }, 3000)
      }
    }

    loadStats()

    // Redireciona automaticamente quando a internet voltar
    window.addEventListener('online', () => {
      window.location.href = '/'
    })
  </script>
</body>
</html>
